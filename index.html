  <script>
    const fsBtn = document.getElementById('fs-btn');
    const reloadBtn = document.getElementById('reload-btn');

    async function forceHardReload() {
      if (reloadBtn) reloadBtn.innerHTML = '<span>⏳ Reloading...</span>';
      try {
        if (window.indexedDB && indexedDB.databases) {
          const dbs = await indexedDB.databases();
          for (const db of dbs) {
            if (db.name && (db.name.includes('Unity') || db.name.includes('idbfs'))) {
              indexedDB.deleteDatabase(db.name);
            }
          }
        }
      } catch (e) {}
      window.location.href = window.location.origin + window.location.pathname + '?r=' + Date.now();
    }

    // Intercept F5 and Ctrl+R in capture phase before Unity can prevent reload
    window.addEventListener('keydown', function (e) {
      if (e.key === 'F5' || (e.ctrlKey && (e.key === 'r' || e.key === 'R'))) {
        e.preventDefault();
        e.stopImmediatePropagation();
        forceHardReload();
      }
    }, true);

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    });

    reloadBtn.addEventListener('click', () => {
      forceHardReload();
    });
